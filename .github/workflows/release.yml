name: Release

on:
  push:
    tags:
      - 'v*'

# No token permission at workflow level. Each job declares its own below. A
# workflow that reads the signing key must declare this, so a job cannot inherit
# a broader token by default.
permissions: {}

jobs:
  # Everything a tag can get wrong is decided here, in seconds, before four
  # platform builds start. Two of these checks used to fail late or not at all:
  #
  # - A non-numeric prerelease (v0.1.0-rc.1) passes semver and passes Linux and
  #   macOS, then kills the Windows job at MSI bundling time -- after the full
  #   release compile -- with no artifact. See docs/releasing.md.
  # - tauri-action substitutes __VERSION__ from tauri.conf.json, not from the
  #   git ref, so a tag and an app version that disagree produced a release
  #   named after the app version while the pushed tag said something else.
  #   Nothing failed; the two just silently diverged.
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # The ancestry check below needs the commit history, not a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the release version and choose its channel
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checks and the channel rule live in the script, so they can be
          # run locally: scripts/test-release-preflight.sh. The channel comes
          # from .github/release-channels.txt, never from the tag's shape.
          scripts/release-preflight.sh "$TAG"

      # The production signing key is released only to the release jobs below,
      # and only for a tag that names a commit reachable from main. The check
      # resolves the tag to its commit, so it holds for an annotated tag too.
      # It runs here, before the environment gate, so a reviewer sees its result.
      - name: Check that the tag names a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-tag-on-main.sh "$TAG"

  release:
    needs: preflight
    # The signing secrets reach this job only through this environment, after
    # its protection rules pass: a required reviewer approves each run. The
    # environment exists and holds the two updater signing secrets. The
    # repository-level copies of those secrets remain until the post-merge
    # signing probe succeeds through the environment, and are removed after it.
    # See docs/releasing.md, section 7, "Signing, stated accurately".
    environment: release-signing
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install trunk
        uses: ./.github/actions/install-trunk

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # The Linux packages ship the `slashit` CLI at /usr/bin/slashit, copied
      # from target/release by bundle.linux.{deb,rpm}.files. Build it first so
      # the bundler finds it. macOS and Windows installers do not include it.
      - name: Build the slashit CLI for the Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo build -p slashit --release

      # Pins the Tauri CLI to the version the updater signing probe runs
      # (.github/workflows/updater-signing-probe.yml). Update both together.
      # tauri-action would otherwise install @tauri-apps/cli@v2, which floats.
      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4

      # The release description is this version's CHANGELOG.md section plus the
      # installation and signing notices, built for the version the preflight
      # job validated, so it cannot take another version's section. The text is
      # multi-line, so it goes out through a delimiter that cannot occur in it.
      # `shell: bash` is required: the Windows runner's default shell is
      # PowerShell, which cannot run this script's `set -euo pipefail`.
      - name: Write the release description for this version
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<SLASHIT_RELEASE_NOTES_END"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "SLASHIT_RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These sign the updater manifest and its artifacts so a running app
          # can verify an update it downloads. They are NOT OS code signing:
          # the installers carry no Authenticode certificate and are not
          # notarized by Apple. See docs/releasing.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Taken from the git ref rather than tauri-action's __VERSION__
          # placeholder, which resolves from tauri.conf.json and can therefore
          # name a release something other than the tag that triggered it. The
          # preflight job has already proven the two agree, so this is the same
          # string by construction -- it just cannot drift again.
          # Runs the pinned `tauri` installed above. Without this input
          # tauri-action ignores the pin and installs @tauri-apps/cli@v2 itself.
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'SlashIt ${{ github.ref_name }}'
          # The CHANGELOG.md section for this version, then the installation
          # and signing notices. See scripts/release-notes.sh.
          releaseBody: ${{ steps.notes.outputs.body }}
          # Drafts are deliberate. Nothing in this workflow verifies that the
          # artifacts install and launch, so a human checks them and presses
          # Publish. Note that a draft is invisible to the updater endpoint --
          # see the summary printed by the next job.
          releaseDraft: true
          # The flag the preflight job derived from the channel it read from
          # .github/release-channels.txt. A prerelease is never marked latest.
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true

  # The release is a draft at this point, so the run is not done -- it is
  # waiting on a person. Saying so on the run page beats it being true only in
  # a document nobody opens at the moment it matters.
  next-steps:
    needs: [preflight, release]
    runs-on: ubuntu-22.04
    # No checkout, no third-party action, and its one step only appends to
    # $GITHUB_STEP_SUMMARY — a local file, not a GitHub API write. Needs
    # nothing from GITHUB_TOKEN at all.
    permissions: {}
    steps:
      - name: Explain what still has to happen by hand
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## SlashIt ${GITHUB_REF_NAME} built"
            echo
            echo "The GitHub release is a **draft**. It is not visible to users and"
            echo "not visible to the auto-updater until someone publishes it."
            echo
            echo "1. Download one artifact per platform and confirm it installs and launches."
            echo "2. Publish the draft release."
            echo
            echo "### Auto-update"
            echo
            echo "The app does not read \`releases/latest\`. It lists the releases and"
            echo "offers the highest version its update channel allows. Drafts are never"
            echo "offered; a published release is offered once it has a \`latest.json\`."
            echo
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "- \`$VERSION\` is a prerelease. Once published, it is offered to installs"
              echo "  on the Prerelease update channel. Installs on the Stable channel are not"
              echo "  offered it."
            else
              echo "- \`$VERSION\` is a stable release. Once published, it is offered to installs"
              echo "  on both the Stable and the Prerelease update channels."
            fi
            echo
            echo "See docs/releasing.md, section 6."
          } >> "$GITHUB_STEP_SUMMARY"
