name: Linux build dependencies
description: >
  The system packages a Tauri/WebKitGTK build needs, in one place so the
  compile job and the acceptance job cannot drift apart.

inputs:
  webdriver:
    description: >
      Also install WebKitWebDriver and a virtual X server. Only the desktop
      acceptance job needs these; a compile-only job would just pay for them.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        packages=(
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libayatana-appindicator3-dev
          librsvg2-dev
        )
        if [ "${{ inputs.webdriver }}" = "true" ]; then
          # webkit2gtk-driver provides WebKitWebDriver, which tauri-driver
          # drives. xvfb provides the display the application renders into --
          # hosted runners have none.
          packages+=(webkit2gtk-driver xvfb)
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"
