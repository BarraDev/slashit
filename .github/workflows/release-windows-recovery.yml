name: Release Windows recovery

# Builds the Windows installers for an existing draft release and uploads them
# into it. It exists because the first release's Windows job failed before it
# built anything; see docs/releasing.md, "Recovering a partial draft".
#
# It touches nothing else: the tag is only read, the draft's name, body and
# flags are unchanged, and the Linux and macOS assets stay as they are. Only
# tauri-action's asset upload and its latest.json merge write to the release.
#
# It runs only from main, where this file was reviewed. The tag, the release ID
# and the source commit are fixed below. Every check runs before the build step,
# and only that step receives the signing secrets.
on:
  workflow_dispatch:

concurrency:
  group: release-windows-recovery
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_TAG: v0.0.1
  RELEASE_ID: "424989745"
  RELEASE_SOURCE: 744edcb17d7e23994e3b6de970153ccd0bc7a10c

jobs:
  recover-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    # The signing secrets reach this job only through the environment, after its
    # protection rules pass. The checks below still run after approval.
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Refuse any ref other than main
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "FAIL the recovery runs only from refs/heads/main; this run is from $GIT_REF" >&2
            exit 1
          fi

      # The tag is checked out by name here, because a checkout's ref cannot read
      # the env context. The check below proves it is the tag this file names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.0.1
          fetch-depth: 0
          persist-credentials: false

      # The signing key may sign only a commit that main has accepted, so the
      # source must be reachable from main before anything is built.
      - name: Check that the tag names a commit on main
        shell: bash
        run: scripts/check-release-tag-on-main.sh "$RELEASE_TAG"

      - name: Check the source and the draft before building
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [ "$tag_commit" != "$RELEASE_SOURCE" ] || [ "$(git rev-parse HEAD)" != "$RELEASE_SOURCE" ]; then
            echo "FAIL ${RELEASE_TAG} resolves to $tag_commit; expected $RELEASE_SOURCE" >&2
            exit 1
          fi

          # Only one release may carry the tag, and it must be this draft.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [ "$ids" != "$RELEASE_ID" ]; then
            echo "FAIL releases carrying $RELEASE_TAG are: ${ids:-none}; expected only $RELEASE_ID" >&2
            exit 1
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.tag_name, (.draft|tostring), (.prerelease|tostring), .target_commitish] | join(" ")')
          expected="$RELEASE_TAG true true $RELEASE_SOURCE"
          if [ "$release" != "$expected" ]; then
            echo "FAIL release $RELEASE_ID is '$release'; expected '$expected'" >&2
            exit 1
          fi
          echo "ok   $RELEASE_TAG at $RELEASE_SOURCE; release $RELEASE_ID is the draft prerelease"

      # The description must match the draft's body. tauri-action writes these
      # notes into latest.json as its notes, so they must not drift.
      - name: Write the release description from the tagged source
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
          if [ "$existing" != "$(cat "$RUNNER_TEMP/release-notes.md")" ]; then
            echo "FAIL the regenerated description differs from the draft's body; not building" >&2
            exit 1
          fi
          {
            echo "body<<SLASHIT_RELEASE_NOTES_END"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "SLASHIT_RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # The same toolchain as the release workflow's Windows job, so the
      # installers are built the way the other platforms' were.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install trunk
        uses: ./.github/actions/install-trunk

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4

      # The only step that receives the signing secrets. It builds the tagged
      # source and uploads into release RELEASE_ID. releaseId takes precedence
      # over tagName, so no lookup by tag can create or select another release.
      - name: Build the Windows installers and upload them to the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          releaseId: ${{ env.RELEASE_ID }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: true
          releaseBody: ${{ steps.notes.outputs.body }}
          uploadUpdaterJson: true

      - name: Inventory the draft after the upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '{tag_name, draft, prerelease, assets: [.assets[] | {name, size}]}'
