name: CI

# No job here pushes, comments, or otherwise writes back to the repository —
# they only check out, build and test. Least privilege the default GITHUB_TOKEN
# down to that.
#
# Every checkout also sets `persist-credentials: false`. `actions/checkout`
# otherwise leaves the token in `.git/config`, and these jobs build and run
# code from the pull request's own revision -- including a desktop acceptance
# job that uploads `target/acceptance` as an artifact when it fails. A token
# that is never written to the workspace cannot be read out of it.
permissions:
  contents: read

on:
  # Validating every push to `main` is enough on the push side: everything
  # else reaches `main` as a pull request, and gets validated there.
  push:
    branches: [main]

  # Deliberately unfiltered. A stacked pull request targets the branch below
  # it rather than `main`, and those base branches are ordinary implementation
  # branches whose names follow no fixed convention — `feat/**` today,
  # `test/**`, `fix/**` and `ci/**` already, and whatever the next change
  # needs. A base-branch allowlist here would let branch naming decide whether
  # a change is validated at all, and a pull request showing no checks reads
  # as "nothing to run" rather than "never tested". Every pull request gets
  # CI; what it happens to be based on is not the workflow's business.
  pull_request:

# One in-flight run per pull request, keyed by PR number so two different PRs
# never cancel each other regardless of what branch either is based on; a push
# event carries no PR number, so pushes fall back to `github.ref`, which is
# `refs/heads/main` for every push here since that is the only branch this
# workflow's `push` trigger watches — newer runs there cancel a stale one too,
# which is correct because only the latest commit on `main` needs a green
# build. `github.workflow` keeps the group unique to this workflow file.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Structural checks on the agent documentation (AGENTS.md and CLAUDE.md):
  # pairing, module coverage, cited paths, the nested-doc list, size budgets
  # and product vocabulary. It needs only the checkout, so it finishes in
  # seconds and does not wait on any Rust build. It never writes to the
  # repository and uses no secrets, network access or model. Contributors run
  # the same script locally.
  agent-docs:
    runs-on: ubuntu-22.04
    name: Agent docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check agent documentation structure
        run: scripts/check-agent-docs.sh

      - name: Self-test the checker
        run: scripts/test-check-agent-docs.sh

      - name: Self-test the publication read-back guard
        run: scripts/test-verify-published-commit.sh

  # The Linux validation is three independent jobs rather than one serial one,
  # so the wall-clock is the slowest of them, not their sum. Each installs and
  # caches only what its own steps need; none consumes anything another job
  # produced.
  #
  # Static checks: both Clippy runs, the shard-manifest proof and the embedded
  # WebDriver feature-boundary assertion. Backend Clippy compiles the Tauri
  # crate, so this job needs the WebKitGTK dependencies. It needs neither the
  # wasm target, `jj` (nothing here runs a test) nor `trunk`.
  lint:
    runs-on: ubuntu-22.04
    name: Lint and structural checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add Clippy
        run: rustup component add clippy

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-build-deps

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy (backend + CLI)
        run: cargo clippy -p slashit-ui -p slashit -p slashit-ipc -p slashit-durable-fs -p slashit-attention -p slashit-activity -p slashit-review-content -- -D warnings

      # `--all-targets --features run-acceptance` so the acceptance journeys
      # themselves are linted, not just the harness library. They are behind a
      # required feature and would otherwise never be compiled here.
      - name: Clippy (acceptance harness)
        run: cargo clippy -p slashit-acceptance --all-targets --features run-acceptance -- -D warnings

      # Proves crates/slashit-acceptance/shard-manifest.txt exactly covers
      # `cargo test --list` for the product acceptance journeys: every test
      # in exactly one of the three shards the acceptance-product matrix
      # below runs. This needs only the test binary (already built for the
      # clippy step above); it boots no display and no application, so it
      # lives here rather than in the acceptance job it guards.
      - name: Desktop acceptance shard manifest covers every journey
        run: scripts/check-acceptance-shards.sh

      # The release workflow's preflight decides the channel and refuses a bad
      # version before any build starts. Its rules run here, against the
      # repository as it is and against fixture trees, so a change to the
      # script, the channel declarations or the version manifests is tested on
      # every pull request rather than first on a tag. It needs only bash, jq
      # and the checkout.
      - name: Release preflight channel and version rules
        run: scripts/test-release-preflight.sh

      # The release description is one version's CHANGELOG section. This runs
      # against fixture changelogs, so a version can never take another version's
      # section, and against the repository's own CHANGELOG.md.
      - name: Release description takes only its own version's section
        run: scripts/test-release-notes.sh

      # A Windows runner runs a step in PowerShell unless the step names
      # `shell:`. A step with POSIX syntax and no `shell:` fails only there, after
      # the rest of its job has run, so every workflow is checked here.
      - name: Windows run steps name their shell when they use POSIX syntax
        run: scripts/test-check-workflow-shells.sh

      # The embedded WebDriver server can drive the webview and evaluate
      # arbitrary JavaScript. Asserting it stays out of a default build is
      # cheaper than trusting that nobody adds it to `default` by accident.
      - name: The embedded WebDriver plugin must be opt-in
        run: |
          set -euo pipefail
          if cargo tree -p slashit-ui -e normal | grep -F tauri-plugin-wdio-webdriver >/dev/null; then
            echo "::error::tauri-plugin-wdio-webdriver is reachable from a default build"
            exit 1
          fi
          cargo tree -p slashit-ui -e normal --features acceptance-webdriver \
            | grep -F tauri-plugin-wdio-webdriver >/dev/null

  # Backend and harness unit tests. The backend test build compiles the Tauri
  # crate, so it needs the WebKitGTK dependencies; it needs no wasm target or
  # `trunk`.
  test-backend:
    runs-on: ubuntu-22.04
    name: Backend and harness tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-build-deps

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `commands::pr::tests` exercises real `jj` behavior (not a mock), so
      # the runner needs an actual `jj` binary on PATH before this step.
      - name: Install jj
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: jj

      - name: Tests (backend + harness units)
        run: cargo test -p slashit-ui -p slashit-ipc -p slashit-durable-fs -p slashit-attention -p slashit-activity -p slashit-review-content -p slashit-acceptance

  # `slashit-frontend` is the root package (Leptos/WASM), not `slashit-ui`
  # -- see that crate's own Cargo.toml comment. It does not depend on the
  # Tauri crate, so this job installs none of the WebKitGTK system packages.
  frontend:
    runs-on: ubuntu-22.04
    name: Frontend tests and build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Its unit tests run on the host target, not wasm32:
      # `#[wasm_bindgen_test]` compiles to a plain `#[test]` off wasm32, and
      # the handful of tests that need a real browser (`wasm_input_tests`,
      # `kanban_tests`) are already scoped behind
      # `#[cfg(target_arch = "wasm32")]`/`wasm_bindgen_test_configure!(run_in_browser)`
      # in their own source, so this step runs only the portable subset --
      # it does not need the wasm32 target this job adds for `trunk build`.
      - name: Tests (frontend components/models)
        run: cargo test -p slashit-frontend

      - name: Install trunk
        uses: ./.github/actions/install-trunk

      - name: Build frontend
        run: trunk build

  # Desktop acceptance against the REAL application: a real Tauri process, the
  # real Leptos/WASM frontend and the real Rust backend, driven over W3C
  # WebDriver by `thirtyfour`. No Node, npm or WebdriverIO is involved.
  #
  # Linux carries this burden alone and deliberately. macOS and Windows desktop
  # acceptance answer "does this still work on the platform?", which is a
  # question worth asking at a release candidate or when the harness itself
  # changes -- not on every commit, where it would buy repetition rather than
  # signal and would compete for scarce macOS capacity. Neither is wired to run
  # automatically here; the existing compile checks below are unchanged.
  #
  # Product journeys still run on three independent runners. The harness's
  # two real-application journeys and five native-driver readiness regressions
  # run once in shard 2, using the application this shard already built. This
  # removes one redundant application build and runner setup. A harness failure
  # does not suppress the product journeys in that shard; both test results
  # remain visible in the job log.
  #
  # The shard manifest completely assigns the product journeys. The harness
  # target is separate from that manifest and is selected only in shard 2.
  acceptance-product:
    runs-on: ubuntu-22.04
    name: Desktop acceptance / product shard ${{ matrix.shard }}
    strategy:
      # One shard's failure must not hide another's: each is independent
      # product coverage, not a retry of the same thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-build-deps
        with:
          webdriver: 'true'

      # The harness and product shards build the same acceptance application
      # from the same lockfile. The shared key removes the job ID so jobs with
      # the same Rust environment fingerprint can reuse one another's cache.
      # rust-cache still separates different Rust environments and lockfiles.
      # On a fully cold run they may all miss before the first job saves; later
      # runs can restore the cache for their matching environment.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: acceptance

      - name: Install trunk
        uses: ./.github/actions/install-trunk

      - name: Install the Tauri CLI and tauri-driver
        uses: ./.github/actions/install-tauri-tools

      - name: Build the application under test
        id: acceptance_build
        run: scripts/build-acceptance-app.sh

      - name: Harness acceptance tests
        if: ${{ matrix.shard == 2 }}
        run: scripts/run-desktop-acceptance.sh --harness

      # `--shard` reads crates/slashit-acceptance/shard-manifest.txt for this
      # shard's exact test names, the same file the coverage check in "Lint
      # and structural checks" validates against `cargo test --list`.
      - name: Product acceptance journeys (shard ${{ matrix.shard }})
        if: ${{ !cancelled() && steps.acceptance_build.outcome == 'success' }}
        run: scripts/run-desktop-acceptance.sh --shard ${{ matrix.shard }}

      # Artifact names carry the shard ID so three concurrent jobs cannot
      # overwrite each other's evidence. Shard 2 may contain harness evidence.
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-failure-artifacts-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/acceptance
          if-no-files-found: warn
          retention-days: 7

  # Windows and macOS were previously first compiled at tag time, inside the
  # release build. That is the worst possible place to discover a
  # `#[cfg(unix)]` that should have been `#[cfg(not(windows))]`: the tag is
  # already pushed and the fix needs a new one. The IPC layer now carries three
  # transports (Unix socket, named pipe, TCP) selected by cfg, so the class of
  # break this catches is not hypothetical -- it has already happened once.
  #
  # `cargo check`, not `clippy -D warnings` and not `tauri build`: this gate
  # exists to answer "does it still compile off Linux", cheaply enough to run
  # on every pull request. Lint policy and bundling stay on the Linux job and
  # the release workflow respectively. The repository is public, so these
  # runners cost nothing.
  cross-compile:
    name: Compile check (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Runs the shared trunk installer on the platforms the release builds on,
      # so a broken Windows or macOS install fails on a pull request rather than
      # on the first tag. The installer checks the binary's version before it
      # reports success.
      - name: Install trunk
        uses: ./.github/actions/install-trunk

      # `slashit-acceptance` is included on purpose even though its runtime is
      # Linux-only. Its portable half (the WebDriver assertions, the port
      # helpers, the diagnostics) is what a future macOS or Windows provider
      # will reuse, and this is what keeps the boundary honest: the moment a
      # `/proc` read, a `libc::kill` or an XDG assumption escapes its
      # `#[cfg(target_os = "linux")]`, this job fails instead of the platform
      # quietly becoming unbuildable.
      #
      # `--tests` compiles (not runs) every unit and integration test target
      # in these five packages, not just their production code. It is safe
      # here specifically because: `slashit-acceptance`'s Linux-only runtime
      # (`context`/`driver`/`fake_agent`/`process`/`state`) is gated
      # `#[cfg(target_os = "linux")]` at the `pub mod` declaration, and its
      # `acceptance`/`product_acceptance` integration-test binaries both
      # declare `required-features = ["run-acceptance"]`, which this command
      # does not pass -- so cargo skips compiling those binaries here
      # entirely, on any platform. It does *not* prove they compile with that
      # feature enabled off Linux; nothing in this job claims that. Every
      # `std::os::unix`/`PermissionsExt`-using test in the other four
      # packages is individually `#[cfg(unix)]`-gated at its own definition,
      # and test code that needs a Linux-only API (tokio's read-write FIFO
      # open in `task_terminal_cleanup_lifecycle.rs`, and runner fixtures that
      # only Linux tests use) is gated `#[cfg(target_os = "linux")]` instead,
      # so the macOS leg compiles it out rather than failing on it.
      - name: Check (backend + CLI + IPC + attention rule + acceptance harness, including test code)
        run: cargo check --tests -p slashit-ui -p slashit -p slashit-ipc -p slashit-durable-fs -p slashit-attention -p slashit-activity -p slashit-review-content -p slashit-acceptance

  # The compile check above cannot say whether the named-pipe transport works,
  # only that it builds. This job runs it: the IPC crate's own tests (the
  # named-pipe unit tests and the owner-only security descriptor) and the same
  # control-channel integration suite Linux runs, with the local endpoint being
  # a uniquely named pipe served by the fully assembled server. That suite
  # includes the authorization rule that lets an OS-verified peer reach the
  # agent-spawning verbs while a token-holding TCP peer is refused.
  #
  # Deliberately not a general Windows `cargo test`: only these two targets are
  # known to be meaningful on Windows, and the rest of the backend's tests
  # assume a Unix toolchain. Widening this is a separate decision.
  windows-ipc:
    name: IPC tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: IPC crate tests (named-pipe transport)
        run: cargo test -p slashit-ipc

      - name: IPC integration suite (assembled server over a named pipe)
        run: cargo test -p slashit-ui --test ipc_integration

  # The update feed's transport policy is compiled on every platform, but the
  # compile check above never runs it. These tests run the production client
  # against local HTTP and HTTPS servers: a plain-HTTP request is refused before
  # connecting, an HTTPS redirect to plain HTTP is refused, and an HTTPS redirect
  # to another host is followed. The TLS tests trust a certificate generated per
  # run, so the platform's certificate verifier is not consulted. Only the
  # `update_feed` tests run here, not the whole library, on the two non-Linux
  # release platforms. The Linux test job runs the rest of the backend.
  updater-transport:
    name: Updater transport tests (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Update feed transport tests
        if: runner.os != 'Windows'
        run: cargo test -p slashit-ui --lib update_feed

      # tauri-build embeds the Common Controls v6 manifest only into binaries
      # (embed-resource links it with rustc-link-arg-bins), so the library test
      # harness starts with comctl32 v5. rfd imports TaskDialogIndirect, which v5
      # lacks, and the harness exits with STATUS_ENTRYPOINT_NOT_FOUND before any
      # test runs. This embeds the same manifest into the test executable only.
      - name: Build update feed test executable (Windows)
        if: runner.os == 'Windows'
        id: build
        shell: pwsh
        run: |
          $messages = cargo test -p slashit-ui --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed with $LASTEXITCODE" }
          $exe = $messages |
            ForEach-Object { $_ | ConvertFrom-Json -ErrorAction SilentlyContinue } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'slashit_ui_lib' -and $_.executable } |
            ForEach-Object { $_.executable } |
            Select-Object -Last 1
          if (-not $exe) { throw "the library test executable was not reported by cargo" }

          $manifest = Join-Path $env:RUNNER_TEMP 'update-feed-test.manifest'
          $xml = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          [IO.File]::WriteAllText($manifest, $xml)

          $mt = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $mt) { throw "mt.exe was not found in the Windows SDK" }

          & $mt.FullName -nologo -manifest $manifest "-outputresource:$exe;#1"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe could not embed the manifest" }
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:$(Join-Path $env:RUNNER_TEMP 'embedded.manifest')"
          if ($LASTEXITCODE -ne 0) { throw "the embedded manifest could not be read back" }

          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Run update feed transport tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri
        env:
          TEST_EXE: ${{ steps.build.outputs.exe }}
        run: |
          $output = & $env:TEST_EXE update_feed 2>&1
          $output | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) { throw "the update_feed tests exited with $LASTEXITCODE" }
          if (-not ($output -match 'test result: ok\. [1-9][0-9]* passed')) { throw "no update_feed test passed" }

  # Durable replacement has a different implementation on each platform
  # (fsync, F_FULLFSYNC, a directory flush on Windows), so the crate that
  # owns it runs its tests on all three. The crate is dependency-light on
  # purpose, which keeps this job to a minute or two. It proves the call
  # sequence, the permission and failure semantics on each platform's real
  # filesystem; it cannot prove behavior across a power loss.
  durable-fs:
    name: Durable write tests (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Durable write crate tests
        run: cargo test -p slashit-durable-fs -- --nocapture
