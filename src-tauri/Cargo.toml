[package]
name = "slashit-ui"
version = "0.0.1"
description = "AI agent workspace manager - Tauri v2 desktop app with Kanban, terminals, and queue execution"
license = "MPL-2.0"
repository = "https://github.com/BarraDev/slashit"
edition = "2021"
default-run = "slashit-ui"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slashit_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The fake ACP agent that the ACP v1 tests spawn. It is a test fixture, not a
# product binary: `required-features` keeps it out of every build that does not
# enable `acp-fixture`, and the dev-dependency on this package below enables it
# for `cargo test` only. `test`/`doc` are off so no harness runs it.
[[bin]]
name = "acp_fixture_agent"
path = "tests/fixtures/acp_fixture_agent.rs"
test = false
doc = false
required-features = ["acp-fixture"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
sysinfo = "0.32"
directories = "5"
# Filesystem total and available space: `statvfs` on Unix,
# `GetDiskFreeSpaceExW` on Windows.
fs4 = "1.1"
toml = "0.8"
portable-pty = "0.8"
futures = "0.3"
which = "8.0.0"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tempfile = "3"
slashit-activity = { path = "../crates/slashit-activity" }
slashit-attention = { path = "../crates/slashit-attention" }
slashit-review-content = { path = "../crates/slashit-review-content" }
slashit-ipc = { path = "../crates/slashit-ipc" }
slashit-durable-fs = { path = "../crates/slashit-durable-fs" }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-updater = "2"
# The releases API client (`update_feed`). No TLS provider is compiled in by
# default; the provider is the one the updater plugin uses, installed in
# `update_feed::client`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# The TLS provider the updater plugin also uses (`ring`), installed once by
# `update_feed::client` before the first request.
rustls = { version = "0.23", features = ["ring"] }
# Argument parsing for the `slashitd` binary.
clap = { version = "4", features = ["derive"] }
# Embedded W3C WebDriver server, for acceptance builds only. Optional, so a
# normal build never compiles or links it. See the `acceptance-webdriver`
# feature below.
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[target.'cfg(unix)'.dependencies]
# `waitid`'s `WNOWAIT` (see `agents::runner::ClaudeRunner::wait`) needs the raw
# syscall constants and `siginfo_t` layout, which differ between Linux and
# macOS; hand-declaring them the way `geteuid` is declared in `ipc::server`
# would mean getting that per-platform ABI right from memory. Also used
# directly for `killpg`/`process_group`/`kill(pid, 0)` in `agents::runner`,
# one bound syscall source instead of several hand-rolled `extern "C"`
# declarations.
libc = "0.2"
# Directory-handle traversal for storage accounting (`openat` with
# `O_NOFOLLOW`, `fstatat`), so a measurement cannot be steered out of the
# tree it measures by a directory swapped for a link. Already built for
# `fs4`.
rustix = { version = "1", features = ["fs"] }

[features]
# ACCEPTANCE BUILDS ONLY. Never enable this for a release.
#
# It embeds an HTTP WebDriver server inside the application that can locate
# elements, click, and evaluate arbitrary JavaScript in the webview. That is
# exactly what an acceptance harness needs and exactly what a shipped binary
# must not offer. It is opt-in rather than default so the plugin is absent
# from `cargo build`, `cargo tauri build` and the release workflow alike.
#
# The Linux acceptance gate does not use it: there the provider is the
# external `tauri-driver`, and the application under test is a normal build.
# This exists for macOS, where `tauri-driver` is unavailable and the embedded
# server is the only Rust-only path -- and it has not yet been exercised on
# real Apple hardware.
acceptance-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
# Builds the ACP fake agent binary (`acp_fixture_agent`). Enabled only by the
# dev-dependency on this package; see the `[[bin]]` entry above.
acp-fixture = []
# TEST-ONLY. Lets an isolated test build read the releases listing and the
# manifest location from a loopback address instead of GitHub, through the
# `SLASHIT_UPDATER_TEST_*` variables in `update_feed`. Never enabled by the
# release workflow. Without it the seam is not compiled: no variable is read
# and no plaintext transport is accepted. A build with it is still a release
# build (the updater refuses debug builds), and its test public key and
# `plugins.updater.dangerousInsecureTransportProtocol` come from a test-only
# `--config` file, never from the committed `tauri.conf.json`.
updater-test-endpoints = []

[dev-dependencies]
# TEST-ONLY. Builds this package with `acp-fixture`, so `cargo test` builds
# `target/<profile>/acp_fixture_agent`. A plain `cargo build` does not enable
# dev-dependency features (resolver 2), so the binary is not built for it.
slashit-ui = { path = ".", features = ["acp-fixture"] }
# TEST-ONLY. Deterministic fault injection for the durable write protocol.
slashit-durable-fs = { path = "../crates/slashit-durable-fs", features = ["fault-injection"] }
# TEST-ONLY. `test-util` is what makes `tokio::time::pause` available, so a
# regression can assert that a bounded wait *is* bounded without spending the
# bound in wall-clock time. Not part of tokio's `full`, and a dev-dependency
# feature is not unified into `cargo build`, so no shipped binary carries the
# paused-clock machinery.
tokio = { version = "1", features = ["full", "test-util"] }
mockall = "0.13"
# TEST-ONLY. `tauri::test::mock_app` is the only public way to obtain a real
# `tauri::State<AppState>`: `State` is a newtype over a private reference with
# no constructor, so a test that wants to drive a `#[tauri::command]` body
# itself -- rather than a copy of it -- has to go through a managed app. Being
# a dev-dependency feature, it is not unified into `cargo build`/`cargo tauri
# build`, so no shipped binary carries the mock runtime.
tauri = { version = "2", features = ["test"] }
# TEST-ONLY. Generates a self-signed certificate at test time for the loopback
# TLS server behind the updater's HTTPS redirect test. No key is committed. It
# uses `ring`, the provider the app already installs, so no second crypto
# backend is added to the test build.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

